
<!DOCTYPE html>
<html>
<head>
    <title>Journaling</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFB7C5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
            font-family: cursive;
            color: #f08a8a;
            font-size: 50px;
        }

        .subtitle {
            text-align: center;
            font-size: 22px;
            color: #6fa3a9;
            margin: 10px 0 30px;
        }

        .journal-box {
            background-color: #FFE4EC;
            width: 80%;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
        }

        label {
            font-size: 18px;
            color: #6b4b55;
            font-weight: bold;
        }

        input {
            margin-top: 8px;
            margin-bottom: 20px;
            padding: 10px;
            font-size: 16px;
            background-color: #FADADD;
            border: 1px solid #e8a5b5;
            border-radius: 8px;
        }

        textarea {
            width: 100%;
            height: 350px;
            margin-top: 10px;
            padding: 15px;

            background-color: #FFF8E7;
            border: 1px solid #e8a5b5;
            border-radius: 12px;

            font-size: 17px;
            font-family: cursive;
            resize: none;
        }

        textarea::placeholder {
            color: #b98b98;
        }

        .button {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            background-color: #FF69B4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-3px);
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>My Journal</h1>

        <p class="subtitle">
            today i felt...
        </p>

        <div class="journal-box">

            <label>Date:</label><br>
            <input type="date">

            <br>

            <label>Day:</label><br>
            <input type="text" placeholder="Monday">

            <br>

            <label>Time:</label><br>
            <input type="time">

            <br>

            <label>Write your thoughts:</label>

            <textarea
                placeholder="Write about your day, your feelings, your thoughts... ♡">
            </textarea>

            <div class="button">
                <button>Save Entry ♡</button>
            </div>

        </div>

    </div>

</body>
</html>
