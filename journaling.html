<!DOCTYPE html>
<html>
<head>
    <title>Journaling</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFB7C5;
        }

        input::placeholder {
            font-size: 15px;
        }

        button:hover {
            transform: translateY(-6px);
        }

        textarea {
            width: 1350px;
            height: 500px;
            background-color: wheat;
            font-size: 18px;
            padding: 10px;
        }
    </style>
</head>

<body>

<div style="background-color: #FFB7C5; min-height:100vh; padding:20px;">

    <h1 style="text-align:center; font-family:cursive; color:#f08a8a; font-size:50px;">
        My Journal
    </h1>

    <p style="text-align:center; font-size:30px; color:#6fa3a9;">
        today i felt...
    </p>

    <form id="journalForm">

        <h3>Date:</h3>
        <input type="date" id="date"
               style="background-color:#FADADD; font-size:20px">

        <br><br>

        <h3>Day:</h3>
        <input type="text" id="day"
               style="background-color:#FADADD; font-size:20px">

        <br><br>

        <h3>Time:</h3>
        <input type="time" id="time"
               style="background-color:#FADADD; font-size:20px">

        <br><br><br>

        <textarea id="entry"
                  placeholder="Write about your day..."></textarea>

        <br><br>

        <button type="submit"
                style="margin-left:600px;
                       width:120px;
                       height:40px;
                       border-radius:100px;
                       background-color:#FF69B4;
                       border:none;">

            <h3>Save Entry</h3>

        </button>

    </form>

</div>


<script>

document.getElementById("journalForm").addEventListener("submit", function(event) {

    // Prevent page from refreshing
    event.preventDefault();

    // Get values from the form
    let date = document.getElementById("date").value;
    let day = document.getElementById("day").value;
    let time = document.getElementById("time").value;
    let entry = document.getElementById("entry").value;

    // Check if journal entry is empty
    if (entry.trim() === "") {
        alert("Please write something in your journal.");
        return;
    }

    // Create journal entry
    let data =
        "Date: " + date + "\n" +
        "Day: " + day + "\n" +
        "Time: " + time + "\n" +
        "Entry:\n" + entry + "\n" +
        "------------------------\n";

    // Get previous entries
    let oldEntries = localStorage.getItem("journalEntries");

    if (oldEntries === null) {
        oldEntries = "";
    }

    // Save new entry
    localStorage.setItem("journalEntries", oldEntries + data);

    // Show confirmation
    alert("Your journal entry has been saved! 💗");

    // Clear the form
    document.getElementById("journalForm").reset();

});

</script>

</body>
</html>
